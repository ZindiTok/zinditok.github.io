<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>ZindîTok</title>
    <meta name="robots" content="noindex">
    <script>
        // GitHub Pages serves this file for any path that has no real file
        // behind it (like /movies/bekas or /tv/sterk-tv). It re-sends the
        // visitor to index.html with the path packed into the query string;
        // the decoder at the top of index.html then restores the clean URL
        // and the app opens the right page.
        // Technique: rafgraph/spa-github-pages (MIT).
        // pathSegmentsToKeep = 0 because the site lives at the root of
        // zinditok.github.io. If it were a project site (user.github.io/repo/)
        // this would need to be 1.
        var pathSegmentsToKeep = 0;
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>
<body></body>
</html>
